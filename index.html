<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundial 2026 - Quiniela</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header Premium -->
        <header class="main-header">
            <h1 class="logo-title">MUNDIAL <span>2026</span></h1>
            <p class="subtitle">Quiniela Oficial</p>
        </header>

        <!-- Contenedor de Formularios -->
        <main class="auth-box">
            <!-- Selector de Acción -->
            <div class="auth-tabs">
                <button class="tab-btn active" id="tab-login" onclick="toggleAuth('login')">Ya estoy inscrito</button>
                <button class="tab-btn" id="tab-register" onclick="toggleAuth('register')">Registrarme</button>
            </div>

            <!-- Formulario de Login -->
            <form id="form-login" class="auth-form active-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="login-cedula">Número de Cédula</label>
                    <input type="text" id="login-cedula" required placeholder="Ej: 1001234567">
                </div>
                <div class="input-group">
                    <label for="login-celular">Celular (Clave)</label>
                    <input type="password" id="login-celular" required placeholder="Sin el 0 inicial (Ej: 991234567)">
                </div>
                <button type="submit" class="btn-primary">Ingresar a mi Quiniela</button>
            </form>

            <!-- Formulario de Registro -->
            <form id="form-register" class="auth-form hidden-form" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label for="reg-nombres">Nombres completos</label>
                    <input type="text" id="reg-nombres" required placeholder="Tus nombres">
                </div>
                <div class="input-group">
                    <label for="reg-apellidos">Apellidos completos</label>
                    <input type="text" id="reg-apellidos" required placeholder="Tus apellidos">
                </div>
                <div class="input-group">
                    <label for="reg-cedula">Número de Cédula</label>
                    <input type="text" id="reg-cedula" required placeholder="Ej: 1001234567">
                </div>
                <div class="input-group">
                    <label for="reg-celular">Celular (Será tu clave)</label>
                    <input type="number" id="reg-celular" required placeholder="Sin el 0 inicial (Ej: 991234567)">
                </div>
                <button type="submit" class="btn-primary">Completar Registro</button>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
