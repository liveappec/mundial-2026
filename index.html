<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundial 2026 - Quiniela</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PANTALLA DE LOGIN / REGISTRO -->
    <div class="app-container" id="auth-view">
        <header class="main-header">
            <h1 class="logo-title">MUNDIAL <span>2026</span></h1>
            <p class="subtitle">Quiniela Oficial</p>
        </header>

        <main class="auth-box">
            <div class="auth-tabs">
                <button class="tab-btn active" id="tab-login" onclick="toggleAuth('login')">Ya estoy inscrito</button>
                <button class="tab-btn" id="tab-register" onclick="toggleAuth('register')">Registrarme</button>
            </div>

            <!-- Formulario de Login -->
            <form id="form-login" class="auth-form active-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Número de Cédula</label>
                    <input type="text" id="login-cedula" required>
                </div>
                <div class="input-group">
                    <label>Celular (Clave)</label>
                    <input type="password" id="login-celular" required>
                </div>
                <button type="submit" class="btn-primary">Ingresar a mi Quiniela</button>
            </form>

            <!-- Formulario de Registro -->
            <form id="form-register" class="auth-form hidden-form" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>Nombres completos</label>
                    <input type="text" id="reg-nombres" required>
                </div>
                <div class="input-group">
                    <label>Apellidos completos</label>
                    <input type="text" id="reg-apellidos" required>
                </div>
                <div class="input-group">
                    <label>Número de Cédula</label>
                    <input type="text" id="reg-cedula" required>
                </div>
                <div class="input-group">
                    <label>Celular (Clave)</label>
                    <input type="number" id="reg-celular" required>
                </div>
                <button type="submit" class="btn-primary">Completar Registro</button>
            </form>
        </main>
    </div>

    <!-- PANTALLA DEL DASHBOARD (Calendario) -->
    <div class="dashboard-container hidden-view" id="dashboard-view">
        <header class="dash-header">
            <div>
                <h2>Hola, <span id="lbl-username">Usuario</span></h2>
                <p>Tus Pronósticos: <strong id="lbl-stats">0/104</strong></p>
            </div>
            <button class="btn-logout" onclick="logout()">Salir</button>
        </header>

        <!-- Filtro de Fases -->
        <div class="fase-selector">
            <select id="select-fase" onchange="renderMatches()">
                <option value="GRUPOS">Fase de Grupos</option>
                <option value="RONDA DE 32">Ronda de 32</option>
                <option value="OCTAVOS">Octavos de Final</option>
                <option value="CUARTOS">Cuartos de Final</option>
                <option value="SEMIFINAL">Semifinal</option>
                <option value="TERCER PUESTO">Tercer Puesto</option>
                <option value="FINAL">Final</option>
            </select>
        </div>

        <!-- Contenedor dinámico de los partidos -->
        <main id="matches-container"></main>
    </div>

    <script src="script.js"></script>
</body>
</html>
